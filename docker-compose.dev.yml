services:
  target-db:
    image: postgres:17-alpine
    container_name: backup-manager-target-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TARGET_DB_NAME:-project_db}
    ports:
      # Host publish port -> container port. PostgreSQL inside always listens on 5432.
      - "${TARGET_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Must share the app's internal network so the app can resolve 'target-db'.
    networks:
      - internal

  backup-manager:
    depends_on:
      target-db:
        condition: service_healthy
    # The application reads its target database connection from config.yaml.
    # For this dev stack use:
    #   target_database:
    #     host: target-db
    #     port: "5432"
    #     user: postgres
    #     dbname: project_db
    #     sslmode: disable
    # and generate the config with:
    #   go run ./cmd/api init --metadata-host metadata-db --target-host target-db ...
