version: "2"

sql:
  - engine: "postgresql"

    schema: "sql/migrations"

    queries: "sql/queries"

    gen:
      go:
        package: "db"
        out: "internal/repository/db"

        sql_package: "pgx/v5"
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - column: "executions.logs"
            go_type: "encoding/json.RawMessage"
