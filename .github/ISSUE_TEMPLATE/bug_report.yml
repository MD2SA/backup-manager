name: Bug report
description: Report a reproducible problem
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, passwords, connection strings or webhook URLs.
        For security vulnerabilities, use the private advisory instead:
        https://github.com/MD2SA/backup-manager/security/advisories/new

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, commands or API requests that reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `backup-manager version` or the container tag.
      placeholder: "v1.0.0 / sha"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Docker
        - Binary
        - Kubernetes
        - Other
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: "17.5"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, hostnames and connection strings.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed secrets and production data from this report.
          required: true
