name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.26"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint, vet, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint (pinned)
        run: |
          test -x "$(pwd)/bin/golangci-lint" || GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: ./bin/golangci-lint run

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore integration test
        env:
          BACKUP_MANAGER_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test ./internal/backup -run TestRestoreIntegration_Postgres -v -count=1

      - name: Auth integration test
        env:
          BACKUP_MANAGER_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test ./internal/auth -run TestAuthIntegration_Postgres -v -count=1

      - name: Configuration smoke test
        run: |
          go run ./cmd/api init --non-interactive --force \
            --config /tmp/bm-config.yaml --secrets /tmp/bm-secrets.env \
            --storage-path /tmp/bm-backups --temp-dir /tmp \
            --metadata-host localhost --metadata-port 5432 \
            --metadata-user postgres --metadata-db test \
            --metadata-password test --encryption passphrase
          go run ./cmd/api config check --config /tmp/bm-config.yaml

  docker:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max