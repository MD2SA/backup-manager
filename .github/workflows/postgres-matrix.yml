name: PostgreSQL compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/backup/**"
      - "internal/recovery/**"
      - "internal/database/**"
      - "internal/config/**"
      - "internal/metarestore/**"
      - "cmd/api/**"
      - "Dockerfile"
      - ".github/workflows/postgres-matrix.yml"

permissions:
  contents: read

concurrency:
  group: postgres-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build integration test binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test -c -o "${RUNNER_TEMP}/recovery.test" ./internal/recovery
          go test -c -o "${RUNNER_TEMP}/backup.test" ./internal/backup

      # Run the tests inside the matching postgres image so pg_dump, pg_restore
      # and psql always match the server major version. This avoids installing
      # multiple client versions on the runner.
      - name: Restore integration
        env:
          BACKUP_MANAGER_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          docker run --rm --network host \
            -e BACKUP_MANAGER_TEST_DSN \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${RUNNER_TEMP}/backup.test:/backup.test:ro" \
            -w /src/internal/backup \
            --entrypoint /backup.test \
            "postgres:${{ matrix.postgres }}-alpine" \
            -test.run TestRestoreIntegration_Postgres -test.v -test.count=1

      - name: Recovery integration
        env:
          BACKUP_MANAGER_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          docker run --rm --network host \
            -e BACKUP_MANAGER_TEST_DSN \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${RUNNER_TEMP}/recovery.test:/recovery.test:ro" \
            -w /src/internal/recovery \
            --entrypoint /recovery.test \
            "postgres:${{ matrix.postgres }}-alpine" \
            -test.run 'TestRecoveryIntegration_(Postgres|S3)' -test.v -test.count=1
