services:
  # Metadata Database (internal state - NOT publicly exposed)
  #
  # Its credentials live in .env (POSTGRES_*). They must match the
  # `metadata_database` section and the METADATA_DB_PASSWORD secret used by the
  # application's config.yaml/secrets.env.
  metadata-db:
    image: postgres:17-alpine
    container_name: backup-manager-metadata-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Metadata database user is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Metadata database password is required}
      POSTGRES_DB: ${POSTGRES_DB:?Metadata database name is required}
    networks:
      - internal
    volumes:
      - metadata_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # The Backup Manager Microservice
  backup-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-backup-manager:latest}
    container_name: backup-manager-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_CONFIG_PATH: /etc/backup-manager/config.yaml
      APP_MIGRATIONS_DIR: /app/sql/migrations
    volumes:
      - ${APP_BACKUP_PATH:?Backup storage path on the host is required (APP_BACKUP_PATH)}:/backups
      - ${CONFIG_PATH:-./config.yaml}:/etc/backup-manager/config.yaml:ro
      - ${SECRETS_PATH:-./secrets.env}:/etc/backup-manager/secrets.env:ro
    depends_on:
      metadata-db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  internal:
    driver: bridge
    internal: false  # app needs outbound for S3/Discord; metadata DB stays internal

volumes:
  metadata_db_data:
