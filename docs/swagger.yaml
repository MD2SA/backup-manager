      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RestoreResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get a restore job
      tags:
      - restores
  /retention-policies:
    get:
      description: |-
        Get a list of all configured retention policies.
        Policies define how many backups are kept for different time intervals:
        - keep_hourly: Last N hours.
        - keep_daily: Last N days.
        - keep_weekly: Last N weeks.
        - yearly_month: The month (1-12) chosen for yearly preservation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all retention policies
      tags:
      - retention-policies
    post:
      consumes:
      - application/json
      description: |-
        Define a new policy for automatic backup cleanup.
        Fields define the 'Grandfather-Father-Son' retention strategy:
        - keep_daily: 7 means keep one backup per day for 7 days.
        - yearly_month: 1 means the January backup is kept as the yearly one.
      parameters:
      - description: Retention policy configuration
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new retention policy
      tags:
      - retention-policies
  /retention-policies/{id}:
    delete:
      description: Remove a retention policy configuration
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a retention policy
      tags:
      - retention-policies
    put:
      consumes:
      - application/json
      description: |-
        Update a retention policy's configuration by ID.
        Allows changing how many backups are kept at each level.
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Update an existing retention policy
      tags:
      - retention-policies
  /storage-providers:
    get:
      description: |-
        Get a list of all configured storage providers.
        The 'config' field varies by 'type':
        - 'local': Use {"path": "/tmp/backups"} to define the base directory on the server.
        - 's3': Use {"region": "us-east-1", "bucket": "my-backups", "access_key": "...", "secret_key": "..."} for AWS S3 compatible storage.
      produces:
      - application/json
      responses:
