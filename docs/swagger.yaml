basePath: /api/v1
definitions:
  github_com_MD2SA_backup-manager_internal_api_dto.APIKeyResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      revoked_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.AuditEntryResponse:
    properties:
      action:
        type: string
      api_key_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      metadata:
        type: object
      request_id:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      user_id:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.CreateAPIKeyRequest:
    properties:
      expires_in_days:
        maximum: 3650
        minimum: 1
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.CreateAPIKeyResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      key:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      revoked_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse:
    properties:
      checksum:
        type: string
      created_at:
        type: string
      duration:
        type: string
      end_time:
        type: string
      error_message:
        type: string
      id:
        type: string
      is_encrypted:
        type: boolean
      is_pinned:
        type: boolean
      logs:
        items:
          type: string
        type: array
      profile_id:
        type: string
      size:
        type: integer
      start_time:
        type: string
      status:
        type: string
      storage_path:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.MeResponse:
    properties:
      insecure:
        type: boolean
      key_id:
        type: string
      key_prefix:
        type: string
      user:
        $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.UserResponse'
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderRequest:
    properties:
      config:
        type: object
      name:
        type: string
      type:
        enum:
        - discord
        type: string
    required:
    - config
    - name
    - type
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse:
    properties:
      config:
        type: object
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.PinRequest:
    properties:
      pinned:
        type: boolean
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.ProfileRequest:
    properties:
      compression_level:
        maximum: 9
        minimum: 0
        type: integer
      compression_type:
        enum:
        - none
        - gzip
        type: string
      description:
        type: string
      enabled:
        type: boolean
      encryption_enabled:
        type: boolean
      name:
        type: string
      notification_provider_ids:
        items:
          type: string
        type: array
      retention_policy_id:
        type: string
      schedule:
        type: string
      storage_provider_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - compression_type
    - name
    - retention_policy_id
    - schedule
    - storage_provider_ids
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse:
    properties:
      compression_level:
        type: integer
      compression_type:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      encryption_enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      notification_provider_ids:
        items:
          type: string
        type: array
      retention_policy_id:
        type: string
      schedule:
        type: string
      storage_provider_ids:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.RestoreRequest:
    properties:
      confirm:
        type: boolean
      provider_id:
        type: string
      terminate_connections:
        type: boolean
      verify_only:
        type: boolean
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.RestoreResponse:
    properties:
      checksum_verified:
        type: boolean
      created_at:
        type: string
      duration:
        type: string
      error_message:
        type: string
      execution_id:
        type: string
      finished_at:
        type: string
      id:
        type: string
      logs:
        items:
          type: string
        type: array
      provider_id:
        type: string
      request_id:
        type: string
      requested_by_key_id:
        type: string
      requested_by_user_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      storage_path:
        type: string
      target_db:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyRequest:
    properties:
      keep_daily:
        minimum: 0
        type: integer
      keep_hourly:
        minimum: 0
        type: integer
      keep_monthly:
        minimum: 0
        type: integer
      keep_weekly:
        minimum: 0
        type: integer
      keep_yearly:
        minimum: 0
        type: integer
      name:
        type: string
      yearly_month:
        maximum: 12
        minimum: 1
        type: integer
    required:
    - name
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      keep_daily:
        type: integer
      keep_hourly:
        type: integer
      keep_monthly:
        type: integer
      keep_weekly:
        type: integer
      keep_yearly:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      yearly_month:
        type: integer
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderRequest:
    properties:
      config:
        type: object
      name:
        type: string
      type:
        enum:
        - local
        - s3
        type: string
    required:
    - config
    - name
    - type
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderResponse:
    properties:
      config:
        type: object
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.UpdateUserRequest:
    properties:
      active:
        type: boolean
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.UserResponse:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_monitor.HealthStatus:
    enum:
    - healthy
    - warning
    - critical
    type: string
    x-enum-varnames:
    - StatusHealthy
    - StatusWarning
    - StatusCritical
  github_com_MD2SA_backup-manager_internal_monitor.HealthSummary:
    properties:
      active_profiles:
        type: integer
      last_execution_status:
        type: string
      last_success:
        type: string
      next_scheduled:
        type: string
      overdue_profiles:
        type: integer
      status:
        $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_monitor.HealthStatus'
      total_storage_used:
        type: integer
    type: object
  github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse:
    properties:
      error:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a backup management server for Postgres databases.
  title: Backup Manager API
  version: "1.0"
paths:
  /audit:
    get:
      parameters:
      - description: Limit (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.AuditEntryResponse'
            type: array
      summary: List audit entries
      tags:
      - audit
  /auth/keys:
    get:
      description: List key metadata (never the key itself).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.APIKeyResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List the current user's API keys
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Create a new API key. The plaintext key is returned exactly once.
      parameters:
      - description: Key metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.CreateAPIKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create an API key for the current user
      tags:
      - auth
  /auth/keys/{id}/revoke:
    post:
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.APIKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Revoke one of the current user's API keys
      tags:
      - auth
  /auth/me:
    get:
      description: Get the user, key ID and key prefix associated with the current
        API key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get the authenticated user
      tags:
      - auth
  /executions:
    get:
      description: |-
        Get a history of all backup executions in the system across all profiles.
        Results are sorted by creation date (newest first).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all backup executions
      tags:
      - executions
  /executions/{id}:
    get:
      description: |-
        Get full details of a specific backup execution.
        The 'logs' field contains an array of strings formatted as 'TIMESTAMP: MESSAGE'.
        These logs provide a step-by-step trace of the backup pipeline stages.
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get execution details
      tags:
      - executions
  /executions/{id}/pin:
    post:
      consumes:
      - application/json
      description: |-
        Prevent a backup execution from being automatically cleaned up by pinning it.
        Pinned executions are ignored by the retention engine's deletion logic.
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      - description: Pin status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.PinRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Pin or unpin a backup execution
      tags:
      - executions
  /executions/{id}/restore:
    post:
      consumes:
      - application/json
      description: |-
        Enqueue an asynchronous restore for a backup execution.
        A real restore requires "confirm": true. Use "verify_only": true
        to download, decrypt and verify the artifact without touching the target database.
        The target database must be empty; see the configuration guide.
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      - description: Restore options
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RestoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RestoreResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Restore a backup
      tags:
      - restores
  /executions/{id}/restores:
    get:
      description: Get the restore history of a specific backup execution, newest
        first.
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RestoreResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List restores for a backup execution
      tags:
      - restores
  /health/summary:
    get:
      description: Get an aggregated view of system health, storage usage, and active
        profiles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_monitor.HealthSummary'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get system health summary
      tags:
      - health
  /healthz:
    get:
      description: |-
        Check if the API server process is up. This endpoint is public
        (no API key) and is used by container healthchecks.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Simple liveness check
      tags:
      - health
  /notification-providers:
    get:
      description: |-
        Get a list of all configured notification providers.
        The 'config' field varies by 'type':
        - 'discord': Requires {"webhook_url": "https://discord.com/api/webhooks/..."} to send alerts to a Discord channel.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all notification providers
      tags:
      - notification-providers
    post:
      consumes:
      - application/json
      description: |-
        Configure a new destination for backup alerts.
        You must specify a 'type' and its corresponding 'config' object:
        - 'discord': Requires 'webhook_url' in the config object.
      parameters:
      - description: Notification provider configuration
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new notification provider
      tags:
      - notification-providers
  /notification-providers/{id}:
    delete:
      description: Remove a notification provider configuration
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a notification provider
      tags:
      - notification-providers
    put:
      consumes:
      - application/json
      description: |-
        Update a notification provider's configuration by ID.
        Ensure the 'config' object matches the 'type':
        - 'discord': {"webhook_url": "https://discord.com/api/webhooks/..."}
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Update an existing notification provider
      tags:
      - notification-providers
  /profiles:
    get:
      description: |-
        Get a list of all configured backup profiles.
        Profiles link databases to storage destinations via schedules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all backup profiles
      tags:
      - profiles
    post:
      consumes:
      - application/json
      description: |-
        Create a new backup profile with the specified configuration.
        Requires at least one storage_provider_ids and a retention_policy_id.
        The schedule must be a valid cron expression (e.g., "0 0 * * *").
      parameters:
      - description: Profile configuration
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new backup profile
      tags:
      - profiles
  /profiles/{id}:
    delete:
      description: Delete a backup profile by its ID
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a backup profile
      tags:
      - profiles
    get:
      description: Get a profile by ID, including its linked storage and notification
        providers.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get a backup profile
      tags:
      - profiles
    put:
      consumes:
      - application/json
      description: |-
        Update a backup profile by its ID.
        The schedule must be a valid cron expression:
        - "0 * * * *" (Hourly)
        - "0 2 * * *" (Daily at 2:00 AM)
        - "0 0 * * 0" (Weekly on Sunday)
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated profile configuration
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Update an existing backup profile
      tags:
      - profiles
  /profiles/{id}/activate:
    post:
      description: Enable scheduled backups for this profile. Other profiles remain
        enabled.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Enable scheduling for a profile
      tags:
      - profiles
  /profiles/{id}/deactivate:
    post:
      description: Disable scheduled backups for this profile without affecting other
        profiles.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Disable scheduling for a profile
      tags:
      - profiles
  /profiles/{id}/executions:
    get:
      description: |-
        Get a history of all backup executions for a profile.
        Results are sorted by creation date (newest first).
        Status can be: pending, running, success, failed.
        The 'logs' field contains an array of strings formatted as 'TIMESTAMP: MESSAGE'.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List executions for a specific profile
      tags:
      - executions
  /profiles/{id}/run:
    post:
      description: |-
        Trigger an asynchronous backup execution for a specific profile now.
        This bypasses the schedule and enqueues the job in the runner.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Run a backup profile immediately
      tags:
      - profiles
  /restores:
    get:
      description: Get the global restore history, newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RestoreResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all restore jobs
