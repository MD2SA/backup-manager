        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new storage provider
      tags:
      - storage-providers
  /storage-providers/{id}:
