basePath: /api/v1
definitions:
  github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse:
    properties:
      checksum:
        type: string
      created_at:
        type: string
      duration:
        type: string
      end_time:
        type: string
      error_message:
        type: string
      id:
        type: string
      is_pinned:
        type: boolean
      logs:
        items:
          type: string
        type: array
      profile_id:
        type: string
      size:
        type: integer
      start_time:
        type: string
      status:
        type: string
      storage_path:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderRequest:
    properties:
      config:
        type: object
      name:
        type: string
      type:
        enum:
        - discord
        type: string
    required:
    - config
    - name
    - type
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse:
    properties:
      config:
        type: object
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.PinRequest:
    properties:
      pinned:
        type: boolean
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.ProfileRequest:
    properties:
      compression_level:
        maximum: 9
        minimum: 0
        type: integer
      compression_type:
        enum:
        - none
        - gzip
        type: string
      description:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      notification_provider_ids:
        items:
          type: string
        type: array
      retention_policy_id:
        type: string
      schedule:
        type: string
      storage_provider_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - compression_type
    - name
    - retention_policy_id
    - schedule
    - storage_provider_ids
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse:
    properties:
      compression_level:
        type: integer
      compression_type:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      notification_provider_ids:
        items:
          type: string
        type: array
      retention_policy_id:
        type: string
      schedule:
        type: string
      storage_provider_ids:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyRequest:
    properties:
      keep_daily:
        minimum: 0
        type: integer
      keep_hourly:
        minimum: 0
        type: integer
      keep_monthly:
        minimum: 0
        type: integer
      keep_weekly:
        minimum: 0
        type: integer
      keep_yearly:
        minimum: 0
        type: integer
      name:
        type: string
      yearly_month:
        maximum: 12
        minimum: 1
        type: integer
    required:
    - name
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      keep_daily:
        type: integer
      keep_hourly:
        type: integer
      keep_monthly:
        type: integer
      keep_weekly:
        type: integer
      keep_yearly:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      yearly_month:
        type: integer
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderRequest:
    properties:
      config:
        type: object
      name:
        type: string
      type:
        enum:
        - local
        - s3
        type: string
    required:
    - config
    - name
    - type
    type: object
  github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderResponse:
    properties:
      config:
        type: object
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  github_com_MD2SA_backup-manager_internal_monitor.HealthStatus:
    enum:
    - healthy
    - warning
    - critical
    type: string
    x-enum-varnames:
    - StatusHealthy
    - StatusWarning
    - StatusCritical
  github_com_MD2SA_backup-manager_internal_monitor.HealthSummary:
    properties:
      active_profiles:
        type: integer
      last_execution_status:
        type: string
      last_success:
        type: string
      next_scheduled:
        type: string
      overdue_profiles:
        type: integer
      status:
        $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_monitor.HealthStatus'
      total_storage_used:
        type: integer
    type: object
  github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse:
    properties:
      error:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a backup management server for Postgres databases.
  title: Backup Manager API
  version: "1.0"
paths:
  /executions/{id}:
    get:
      description: |-
        Get full details of a specific backup execution.
        The 'logs' field contains an array of strings formatted as 'TIMESTAMP: MESSAGE'.
        These logs provide a step-by-step trace of the backup pipeline stages.
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get execution details
      tags:
      - executions
  /executions/{id}/pin:
    post:
      consumes:
      - application/json
      description: |-
        Prevent a backup execution from being automatically cleaned up by pinning it.
        Pinned executions are ignored by the retention engine's deletion logic.
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      - description: Pin status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.PinRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Pin or unpin a backup execution
      tags:
      - executions
  /executions/{id}/restore:
    post:
      description: Trigger a restoration process from a specific backup execution
      parameters:
      - description: Execution ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Restore a backup
      tags:
      - executions
  /health:
    get:
      description: Check if the API server is up and running
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Simple health check
      tags:
      - health
  /health/summary:
    get:
      description: Get an aggregated view of system health, storage usage, and active
        profiles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_monitor.HealthSummary'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Get system health summary
      tags:
      - health
  /notification-providers:
    get:
      description: |-
        Get a list of all configured notification providers.
        The 'config' field varies by 'type':
        - 'discord': Requires {"webhook_url": "https://discord.com/api/webhooks/..."} to send alerts to a Discord channel.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all notification providers
      tags:
      - notification-providers
    post:
      consumes:
      - application/json
      description: |-
        Configure a new destination for backup alerts.
        You must specify a 'type' and its corresponding 'config' object:
        - 'discord': Requires 'webhook_url' in the config object.
      parameters:
      - description: Notification provider configuration
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new notification provider
      tags:
      - notification-providers
  /notification-providers/{id}:
    delete:
      description: Remove a notification provider configuration
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a notification provider
      tags:
      - notification-providers
    put:
      consumes:
      - application/json
      description: |-
        Update a notification provider's configuration by ID.
        Ensure the 'config' object matches the 'type':
        - 'discord': {"webhook_url": "https://discord.com/api/webhooks/..."}
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.NotificationProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Update an existing notification provider
      tags:
      - notification-providers
  /profiles:
    get:
      description: |-
        Get a list of all configured backup profiles.
        Profiles link databases to storage destinations via schedules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all backup profiles
      tags:
      - profiles
    post:
      consumes:
      - application/json
      description: |-
        Create a new backup profile with the specified configuration.
        Requires at least one storage_provider_ids and a retention_policy_id.
        The schedule must be a valid cron expression (e.g., "0 0 * * *").
      parameters:
      - description: Profile configuration
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new backup profile
      tags:
      - profiles
  /profiles/{id}:
    delete:
      description: Delete a backup profile by its ID
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a backup profile
      tags:
      - profiles
    put:
      consumes:
      - application/json
      description: |-
        Update a backup profile by its ID.
        The schedule must be a valid cron expression:
        - "0 * * * *" (Hourly)
        - "0 2 * * *" (Daily at 2:00 AM)
        - "0 0 * * 0" (Weekly on Sunday)
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated profile configuration
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Update an existing backup profile
      tags:
      - profiles
  /profiles/{id}/activate:
    post:
      description: |-
        Set a profile as the active one for scheduled backups.
        This updates the system scheduler to use this profile's schedule.
        Note: The current system logic may only support one active profile at a time.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Activate a backup profile (sets as scheduled)
      tags:
      - profiles
  /profiles/{id}/executions:
    get:
      description: |-
        Get a history of all backup executions for a profile.
        Results are sorted by creation date (newest first).
        Status can be: pending, running, success, failed.
        The 'logs' field contains an array of strings formatted as 'TIMESTAMP: MESSAGE'.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.ExecutionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List executions for a specific profile
      tags:
      - executions
  /profiles/{id}/run:
    post:
      description: |-
        Trigger an asynchronous backup execution for a specific profile now.
        This bypasses the schedule and enqueues the job in the runner.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Run a backup profile immediately
      tags:
      - profiles
  /retention-policies:
    get:
      description: |-
        Get a list of all configured retention policies.
        Policies define how many backups are kept for different time intervals:
        - keep_hourly: Last N hours.
        - keep_daily: Last N days.
        - keep_weekly: Last N weeks.
        - yearly_month: The month (1-12) chosen for yearly preservation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all retention policies
      tags:
      - retention-policies
    post:
      consumes:
      - application/json
      description: |-
        Define a new policy for automatic backup cleanup.
        Fields define the 'Grandfather-Father-Son' retention strategy:
        - keep_daily: 7 means keep one backup per day for 7 days.
        - yearly_month: 1 means the January backup is kept as the yearly one.
      parameters:
      - description: Retention policy configuration
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new retention policy
      tags:
      - retention-policies
  /retention-policies/{id}:
    delete:
      description: Remove a retention policy configuration
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a retention policy
      tags:
      - retention-policies
    put:
      consumes:
      - application/json
      description: |-
        Update a retention policy's configuration by ID.
        Allows changing how many backups are kept at each level.
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.RetentionPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Update an existing retention policy
      tags:
      - retention-policies
  /storage-providers:
    get:
      description: |-
        Get a list of all configured storage providers.
        The 'config' field varies by 'type':
        - 'local': Use {"path": "/tmp/backups"} to define the base directory on the server.
        - 's3': Use {"region": "us-east-1", "bucket": "my-backups", "access_key": "...", "secret_key": "..."} for AWS S3 compatible storage.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: List all storage providers
      tags:
      - storage-providers
    post:
      consumes:
      - application/json
      description: |-
        Configure a new storage destination for backups.
        You must specify a 'type' and its corresponding 'config' object:
        - 'local': Base directory for storing backups locally. Requires 'path'.
        - 's3': AWS S3 or compatible storage. Requires 'region', 'bucket', 'access_key', and 'secret_key'.
      parameters:
      - description: Storage provider configuration
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Create a new storage provider
      tags:
      - storage-providers
  /storage-providers/{id}:
    delete:
      description: Remove a storage provider configuration
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
      summary: Delete a storage provider
      tags:
      - storage-providers
    put:
      consumes:
      - application/json
      description: |-
        Update a storage provider's configuration by ID.
        Ensure the 'config' object matches the 'type':
        - 'local': {"path": "/tmp/backups"}
        - 's3': {"region": "us-east-1", "bucket": "my-backups", "access_key": "...", "secret_key": "..."}
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: provider
