      description: |-
        Configure a new storage destination for backups.
        You must specify a 'type' and its corresponding 'config' object:
        - 'local': Base directory for storing backups locally. Requires 'path'.
        - 's3': AWS S3 or compatible storage. Requires 'region', 'bucket', 'access_key', and 'secret_key'.
      parameters:
      - description: Storage provider configuration
