      - storage-providers
    put:
      consumes:
      - application/json
      description: |-
        Update a storage provider's configuration by ID.
        Ensure the 'config' object matches the 'type':
        - 'local': {"path": "/tmp/backups"}
        - 's3': {"region": "us-east-1", "bucket": "my-backups", "access_key": "...", "secret_key": "..."}
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_api_dto.StorageProviderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MD2SA_backup-manager_internal_pkg_apiutil.ErrorResponse'
        "500":
          description: Internal Server Error
